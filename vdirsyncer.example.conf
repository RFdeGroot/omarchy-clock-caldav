# Copy to ~/.config/vdirsyncer/config and keep only the accounts you have.
# Then: vdirsyncer discover && vdirsyncer sync && vdirsyncer metasync
#
# Credentials (never your real login password):
#   iCloud    -> https://appleid.apple.com  (Sign-In and Security -> App-Specific Passwords)
#   Nextcloud -> Settings -> Security -> Create new app password
#   Google    -> omarchy pkg add python-aiohttp-oauthlib, then an OAuth "Desktop app"
#                client at console.cloud.google.com with the CalDAV API enabled.
#                First sync opens a browser to authorise.

[general]
status_path = "~/.local/share/vdirsyncer/status/"

# The folder this plugin reads. One subfolder per calendar, full of .ics files.
[storage local]
type = "filesystem"
path = "~/.calendars/"
fileext = ".ics"

[storage icloud]
type = "caldav"
url = "https://caldav.icloud.com/"
username = "you@icloud.com"
password = "xxxx-xxxx-xxxx-xxxx"

[storage nextcloud]
type = "caldav"
url = "https://cloud.example.com/remote.php/dav/"
username = "you"
password = "your-app-password"

[storage google]
type = "google_calendar"
token_file = "~/.local/share/vdirsyncer/google_token"
client_id = "YOUR_ID.apps.googleusercontent.com"
client_secret = "YOUR_SECRET"

# Pair names must differ from every storage name, so they get an _sync suffix.
[pair icloud_sync]
a = "local"
b = "icloud"
# All calendars. For a subset, list collection ids from `vdirsyncer discover`:
#   collections = ["home", "AAAA-BBBB-..."]
collections = ["from b"]
# Carries the calendar names and colours across (needs `vdirsyncer metasync`).
metadata = ["displayname", "color"]

[pair nextcloud_sync]
a = "local"
b = "nextcloud"
collections = ["from b"]
metadata = ["displayname", "color"]

[pair google_sync]
a = "local"
b = "google"
collections = ["from b"]
metadata = ["displayname", "color"]
